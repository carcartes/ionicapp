

<ion-content id="main-content" class="ion-padding">

  <ion-toolbar>
    <ion-buttons slot="start">
      <!-- Icono de cerrar -->
      <ion-icon name="close" (click)="cerrarModal()" style="font-size: 30px; cursor: pointer;"></ion-icon>
    </ion-buttons>
  </ion-toolbar>

  <ion-text color="primary" class="ion-text-center">
    <h1>Edita tu busqueda</h1>
  </ion-text>

  <!-- Caja con borde redondeado y sombra -->
  <ion-card>
    <ion-card-content>
      <ion-list>
        <!-- Campo de origen -->
        <ion-item button (click)="abrirOrigenModal()">
          <ion-icon class="custom-icon" name="ellipse-outline"></ion-icon>
          <ion-label class="truncate-text">{{ origenInput || 'De' }}</ion-label>
        </ion-item>

        <!-- Campo de destino -->
        <ion-item button (click)="abrirDestinoModal()">
          <ion-icon class="custom-icon" name="ellipse-outline"></ion-icon>
          <ion-label class="truncate-text">{{ destinoInput || 'A' }}</ion-label>
        </ion-item>
          
        <!-- Campo de pasajeros -->
        <ion-item button (click)="abrirPasajerosModal()">
          <ion-icon class="custom-icon" name="person-outline"></ion-icon>
          <ion-label>{{ pasajeros }} Pasajero{{ pasajeros > 1 ? 's' : '' }}</ion-label>
        </ion-item>
      </ion-list>
      <ion-button expand="block" [routerLink]="['/buscar-viajes']" [queryParams]="{ origen: origenInput, destino: destinoInput }" (click)="onBuscarClick()">
        Buscar
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
