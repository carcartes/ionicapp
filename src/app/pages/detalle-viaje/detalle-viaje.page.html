<ion-menu side="start" content-id="main-content" class="custom-menu">
  <ion-header></ion-header>
  <ion-content>
    <ion-list>
      <!-- Menú de navegación -->
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/login']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Iniciar sesión</ion-label>
      </ion-item>
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/register']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Registrarse</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/viajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Tus Viajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/mensajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Mensajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/perfil']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" (click)="logout()">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<ion-header>
  <ion-toolbar class="thin-toolbar">
    <ion-title class="ion-text-center">
      <a [routerLink]="['/home']" class="toolbar-title">TellevoAPP</a>
    </ion-title>
    <ion-buttons slot="start" class="ion-padding toolbar-buttons">
      <ion-menu-button class="large-menu-button">
        <ion-icon name="person-outline"></ion-icon>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end" class="ion-padding toolbar-buttons">
      <ion-icon name="search-outline" class="ion-margin-end small-icon" [routerLink]="['/buscar']"></ion-icon>
      <ion-icon name="add-circle-outline" [routerLink]="['/origen']"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content id="main-content" class="ion-padding" *ngIf="viaje && usuario">
  <div class="trip-container">

    <ion-buttons slot="start" class="btn-arrow-margin">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <!-- Fecha del viaje -->
    <h2 class="fecha-titulo">{{ fechaViaje }}</h2>

    <!-- Ruta con puntos, texto y horas -->
    <div class="trip-route">
      <div class="route-point">
        <div class="point"></div>
        <span class="route-text">
          <strong>{{ viaje.origen }}</strong>
        </span>
        <span class="route-time">{{ horaViaje }}</span>
      </div>
      <div class="line"></div>
      <div class="route-point">
        <div class="point"></div>
        <span class="route-text">
          <strong>{{ viaje.destino }}</strong>
        </span>
        <span class="route-time">{{ horaLlegada }}</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Precio y número de pasajeros -->
    <div class="info-bar">
      <span class="precio">1 pasajero</span>
      <span class="precio">${{ viaje.precio }}</span>
    </div>

    <div class="divider"></div>

    <!-- Información del conductor -->
    <div class="driver-info">
      <img src="assets/pfp.png" alt="Conductor" class="driver-picture" />
      <div class="driver-details">
        <p><strong>{{ usuario.name }} {{ usuario.surname }}</strong></p>
      </div>
    </div>

    <ion-button expand="block" color="primary" (click)="reservarViaje()">Reservar</ion-button>
  </div>
</ion-content>
