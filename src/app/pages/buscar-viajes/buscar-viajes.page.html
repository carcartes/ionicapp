<ion-header>
  <ion-toolbar class="thin-toolbar">
    <ion-title class="ion-text-center">
      <a [routerLink]="['/home']" class="toolbar-title">TellevoAPP</a>
    </ion-title>

    <ion-buttons slot="start" class="ion-padding toolbar-buttons">
      <ion-menu-button class="large-menu-button">
        <ion-icon name="person-outline"></ion-icon>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end" class="ion-padding toolbar-buttons">
      <ion-icon name="search-outline" class="ion-margin-end small-icon" [routerLink]="['/buscar']"></ion-icon>
      <ion-icon name="add-circle-outline" [routerLink]="['/origen']"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="viajes.length === 0">
    <ion-card-content class="ion-text-center">
      <ion-text color="medium">
        <h3>No se encontraron viajes para los criterios de búsqueda</h3>
      </ion-text>
    </ion-card-content>
  </ion-card>

  <!-- Listado de viajes -->
  <ion-list *ngIf="viajes.length > 0">
    <ion-item *ngFor="let viaje of viajes" [routerLink]="['/detalle-viaje', viaje.id]">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{ viaje.origen }} → {{ viaje.destino }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p><strong>Fecha:</strong> {{ viaje.fecha }}</p>
          <p><strong>Precio:</strong> ${{ viaje.precio }}</p>
          <p><strong>Pasajeros Disponibles:</strong> {{ viaje.pasajeros }}</p>
          <p><strong>Descripción:</strong> {{ viaje.descripcion }}</p>
          <p><strong>Conductor:</strong> Usuario {{ viaje.usuario_id }}</p>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>
</ion-content>
