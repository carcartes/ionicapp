<ion-menu side="start" content-id="main-content" class="custom-menu">
  <ion-header></ion-header>
  <ion-content>
    <ion-list>
      <!-- Menú de navegación -->
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/login']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Iniciar sesión</ion-label>
      </ion-item>
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/register']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Registrarse</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/viajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Tus Viajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/perfil']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" (click)="logout()">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<ion-header>
  <ion-toolbar class="thin-toolbar">
    <ion-title class="ion-text-center">
      <a [routerLink]="['/home']" class="toolbar-title">TellevoAPP</a>
    </ion-title>
    <ion-buttons slot="start" class="ion-padding toolbar-buttons">
      <ion-menu-button class="large-menu-button">
        <ion-icon name="person-outline"></ion-icon>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end" class="ion-padding toolbar-buttons">
      <ion-icon name="search-outline" class="ion-margin-end small-icon" [routerLink]="['/buscar']"></ion-icon>
      <ion-icon name="add-circle-outline" [routerLink]="['/origen']"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div *ngIf="viaje && viaje.origen && viaje.destino" class="map-container">
    <!-- Tarjeta con detalles del viaje -->
    <ion-card class="details-card">
      <ion-card-header>
        <h6>{{ viaje.origen }} → {{ viaje.destino }}</h6>
        <p>{{ viaje.fecha }}</p>
      </ion-card-header>
      <ion-card-content>
        <p><strong>Conductor:</strong> {{ nombreConductor }}</p>
        <p><strong>Auto:</strong> {{ viaje.auto }}</p>
        <p><strong>Descripción:</strong> {{ viaje.descripcion }}</p>
        <p><strong>Precio:</strong> ${{ viaje.precio }}</p>
      </ion-card-content>
    </ion-card>

    <!-- Mapa con la ruta -->
    <div id="map" style="height: 100%;"></div>

    <!-- Icono de mensaje (WhatsApp) en la esquina inferior derecha -->
    <ion-icon
      name="chatbubble-ellipses-outline"
      class="whatsapp-icon"
      (click)="abrirWhatsApp()"
      [class.disabled]="!telefonoConductor">
    </ion-icon>
  </div>

  <div *ngIf="!viaje || !viaje.origen">
    <p>No se encontraron detalles del viaje.</p>
  </div>
</ion-content>
