<ion-menu side="start" content-id="main-content" class="custom-menu">
  <ion-header>
  </ion-header>
  <ion-content>
    <ion-list>
      <!-- Menú de navegación -->
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/login']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Iniciar sesión</ion-label>
      </ion-item>
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/register']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Registrarse</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/viajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Tus Viajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/mensajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Mensajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/perfil']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" (click)="logout()">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<ion-header>
  <ion-toolbar class="thin-toolbar">
    <ion-title class="ion-text-center">
      <a [routerLink]="['/home']" class="toolbar-title">TellevoAPP</a>
    </ion-title>

    <ion-buttons slot="start" class="ion-padding toolbar-buttons">
      <ion-menu-button class="large-menu-button">
        <ion-icon name="person-outline"></ion-icon>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end" class="ion-padding toolbar-buttons">
      <ion-icon name="search-outline" class="ion-margin-end small-icon" [routerLink]="['/buscar']"></ion-icon>
      <ion-icon name="add-circle-outline" [routerLink]="['/origen']"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="ion-padding">
  <ion-text color="primary" class="ion-text-center">
    <h1>Conecta, ahorra y llega más lejos con TellevoAPP</h1>
  </ion-text>

  <!-- Caja con borde redondeado y sombra -->
  <ion-card>
    <ion-card-content>
      <ion-list>
        <!-- Campo de origen -->
        <ion-item button (click)="abrirOrigenModal()">
          <ion-icon class="custom-icon" name="ellipse-outline"></ion-icon>
          <ion-label class="truncate-text">{{ origenInput || 'De' }}</ion-label>
        </ion-item>

        <!-- Campo de destino -->
        <ion-item button (click)="abrirDestinoModal()">
          <ion-icon class="custom-icon" name="ellipse-outline"></ion-icon>
          <ion-label class="truncate-text">{{ destinoInput || 'A' }}</ion-label>
        </ion-item>

        <!-- Campo de pasajeros -->
        <ion-item button (click)="abrirPasajerosModal()">
          <ion-icon class="custom-icon" name="person-outline"></ion-icon>
          <ion-label>{{ pasajeros }} Pasajero{{ pasajeros > 1 ? 's' : '' }}</ion-label>
        </ion-item>
      </ion-list>
      <ion-button expand="block" [routerLink]="['/buscar-viajes']" [queryParams]="{ origen: origenInput, destino: destinoInput }">
        Buscar
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>

<!-- Footer -->
<ion-footer>
  <ion-toolbar>
    <ion-title class="ion-text-center">
      &copy; 2024 TellevoAPP - Todos los derechos reservados
    </ion-title>
  </ion-toolbar>
</ion-footer>
