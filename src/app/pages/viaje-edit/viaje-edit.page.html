<ion-menu side="start" content-id="main-content" class="custom-menu">
  <ion-header></ion-header>
  <ion-content>
    <ion-list>
      <!-- Menú de navegación -->
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/login']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Iniciar sesión</ion-label>
      </ion-item>
      <ion-item *ngIf="!isAuthenticated" [routerLink]="['/register']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Registrarse</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/viajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Tus Viajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/mensajes']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Mensajes</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" [routerLink]="['/perfil']">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-item>
      <ion-item *ngIf="isAuthenticated" (click)="logout()">
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        <ion-label>Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Main Content -->
<ion-header>
  <ion-toolbar class="thin-toolbar">
    <ion-title class="ion-text-center">
      <a [routerLink]="['/home']" class="toolbar-title">TellevoAPP</a>
    </ion-title>
    <ion-buttons slot="start" class="ion-padding toolbar-buttons">
      <ion-menu-button class="large-menu-button">
        <ion-icon name="person-outline"></ion-icon>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end" class="ion-padding toolbar-buttons">
      <ion-icon name="search-outline" class="ion-margin-end small-icon" [routerLink]="['/buscar']"></ion-icon>
      <ion-icon name="add-circle-outline" [routerLink]="['/origen']"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="viaje">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Detalles del Viaje</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <!-- Origen (deshabilitado para edición) -->
      <ion-item>
        <ion-label>Origen</ion-label>
        <ion-input [(ngModel)]="viaje.origen" [disabled]="true"></ion-input>
      </ion-item>

      <!-- Destino (deshabilitado para edición) -->
      <ion-item>
        <ion-label>Destino</ion-label>
        <ion-input [(ngModel)]="viaje.destino" [disabled]="true"></ion-input>
      </ion-item>

      <!-- Fecha editable -->
      <ion-item>
        <ion-label>Fecha</ion-label>
        <ion-datetime [(ngModel)]="viaje.fecha" [min]="minDate" [max]="maxDate"></ion-datetime>
      </ion-item>

      <!-- Precio (deshabilitado para edición) -->
      <ion-item>
        <ion-label>Precio</ion-label>
        <ion-input type="number" [(ngModel)]="viaje.precio" [disabled]="true"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Asientos Disponibles</ion-label>
        <ion-select [(ngModel)]="viaje.asientosDisponibles">
          <ion-select-option *ngFor="let num of [1, 2, 3, 4]" [value]="num">
            {{ num }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Botón para guardar cambios -->
      <ion-button expand="block" (click)="guardarCambios()">Guardar Cambios</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Reservas</ion-card-title>
    </ion-card-header>
    <ion-list>
      <ion-item *ngFor="let reserva of reservas; let i = index">
        <ion-label>
          {{ reserva.viaje?.destino }} - {{ reserva.viaje?.origen }}
        </ion-label>
        <ion-button color="danger" slot="end" (click)="eliminarReserva(i)">
          Eliminar
        </ion-button>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>
